</style><rect class="bg" x="0" y="0" width="1600" height="1008"/><rect x="30" y="26" width="7" height="34" fill="#801624"/><text class="t" x="48" y="53" font-size="26" font-weight="900">SIGNALLAUFPLAN TON</text><text class="m" x="1570" y="40" font-size="13.5" font-weight="400" text-anchor="end">FoF 2026, TSE Stand, STATION Berlin, Halle 1</text><text class="m" x="1570" y="59" font-size="13.5" font-weight="400" text-anchor="end">Auftrag 177433, Stand 23.11.2026, Material laut Packliste vom 21.11.2026</text><line class="hr" x1="30" y1="78" x2="1570" y2="78"/><rect class="zone" x="30" y="104" width="570" height="690" rx="10"/><rect class="bg" x="42" y="95" width="92.27499999999999" height="18"/><text class="m" x="50" y="108" font-size="11.5" font-weight="800" letter-spacing="0.08em">IN DER BAR</text><rect class="dev" x="60" y="138" width="250" height="84" rx="8"/><text class="t" x="74" y="162" font-size="15" font-weight="700">Zuspieler</text><text class="m" x="74" y="181" font-size="12.5" font-weight="400">Show-Rechner oder Handy</text><text class="m" x="74" y="198" font-size="12.5" font-weight="400">Videos im Showcontrol sind ohne Ton</text><rect class="dev" x="60" y="276" width="250" height="76" rx="8"/><text class="t" x="74" y="300" font-size="15" font-weight="700">DI-Box Palmer PLI 04</text><text class="m" x="74" y="319" font-size="12.5" font-weight="400">Stereo, immer nur ein Zuspieler</text><rect class="dev" x="60" y="410" width="250" height="124" rx="8"/><rect x="60" y="418" width="4" height="108" fill="#801624"/><text class="t" x="74" y="434" font-size="15" font-weight="700">Pult Allen &amp; Heath CQ18T</text><text class="m" x="74" y="453" font-size="12.5" font-weight="400">Musik auf Mono stellen</text><text class="m" x="74" y="470" font-size="12.5" font-weight="400">Limiter auf Main bei +10 dBu</text><text class="m" x="74" y="487" font-size="12.5" font-weight="400">im Betrieb am Touchscreen</text><rect class="dev" x="60" y="596" width="250" height="160" rx="8"