08" font-size="11.5" font-weight="800" letter-spacing="0.08em">AN DER TRAVERSE, über das hintere rechte Bein</text><rect class="dev" x="850" y="150" width="270" height="76" rx="8"/><text class="t" x="864" y="193.0" font-size="15" font-weight="700"></text><rect class="chip" x="862" y="164" width="56" height="48" rx="6" stroke="#ffe14d"/><text class="t" x="890" y="194" font-size="15" font-weight="800" text-anchor="middle">S4</text><text class="t" x="932" y="182" font-size="14" font-weight="700">Seeburg TS Nano</text><text class="m" x="932" y="202" font-size="12.5" font-weight="400">hinten, Mitte rechts</text><rect class="dev" x="1270" y="150" width="270" height="76" rx="8"/><text class="t" x="1284" y="193.0" font-size="15" font-weight="700"></text><rect class="chip" x="1282" y="164" width="56" height="48" rx="6" stroke="#ffe14d"/><text class="t" x="1310" y="194" font-size="15" font-weight="800" text-anchor="middle">S2</text><text class="t" x="1352" y="182" font-size="14" font-weight="700">Seeburg TS Nano</text><text class="m" x="1352" y="202" font-size="12.5" font-weight="400">hinten links</text><rect class="dev" x="850" y="290" width="270" height="76" rx="8"/><text class="t" x="864" y="333.0" font-size="15" font-weight="700"></text><rect class="chip" x="862" y="304" width="56" height="48" rx="6" stroke="#ffe14d"/><text class="t" x="890" y="334" font-size="15" font-weight="800" text-anchor="middle">S3</text><text class="t" x="932" y="322" font-size="14" font-weight="700">Seeburg TS Nano</text><text class="m" x="932" y="342" font-size="12.5" font-weight="400">vorn, Mitte</text><rect class="dev" x="1270" y="290" width="270" height="76" rx="8"/><text class="t" x="1284" y="333.0" font-size="15" font-weight="700"></text><rect class="chip" x="1282" y="304" width="56" height="48" rx="6" stroke="#ffe14d"/><text class="t" x="1310" y="334" font-size="15" font-weight="800" text-anchor="middle">S1</text><text class="t" x="1352" y="322" font-size="14" font-weight="700">Seeburg TS Nano</text><text class="m" x="1352" y="342" font-size="12.5" font-weight="400">vorn links</text><polyline class="w" points="310,646 630,646 630,188 850,188" stroke="#ff8a3c" stroke-width="4"/><polyline class="w" points="1120,188 1270,188" stroke="#ff8a3c" stroke-width="4"/><polyline class="w" points="310,718 645,718 645,328 850,328" stroke="#4fc3f7" stroke-width="4"/><polyline class="w" points="1120,328 1270,328" stroke="#4fc3f7" stroke-width="4"/><text class="m" x="850" y="252" font-size="12.5" font-weight="400">Kanal A: hinteres Paar, durchgeschleift, 2 x 16 Ohm ergibt 8 Ohm</text><text class="m" x="850" y="384" font-size="12.5" font-weight="400">Kanal B: vorderes Paar, durchgeschleift, 8 Ohm</text><rect class="zone" x="660" y="440" width="910" height="354" rx="10"/><rect class="bg" x="672" y="431" width="214.315" height="18"/><text class="m" x="680" y="444" font-size="11.5" font-weight="800" letter-spacing="0.08em">DRAUFSICHT, vorn ist unten</text><rect x="737.24" y="474.24" width="755.52" height="275.52" fill="none" stroke="var(--sp-mut)" stroke-width="2"/><line x1="737.24" y1="474.24" x2="1492.76" y2="474.24" stroke="var(--sp-fg)" stroke-width="5"/><line x1="1492.76" y1="474.24" x2="1492.76" y2="749.76" stroke="var(--sp-fg)" stroke-width="5"/><text class="m" x="1115.0" y="464.24" font-size="11.5" font-weight="400" text-anchor="middle">Molton hinten und rechts</text><text class="m" x="1115.0" y="771.76" font-size="11.5" font-weight="400" text-anchor="middle">Gang und Publikum</text><rect class="dev" x="1235.0" y="568.8" width="187.20000000000005" height="168.0" rx="6"/><text class="m" x="1328.6" y="676.8" font-size="12.5" font-weight="700" text-anchor="middle">Bar</text><rect x="1299.4" y="610.52" width="44" height="26" rx="4" fill="#801624"/><text x="1321.4" y="628.02" font-size="11.5" font-weight="800" text-anchor="middle" fill="#fff">Amp</text><rect x="1469.8400000000001" y="479.15999999999997" width="18" height="18" fill="var(--sp-fg)"/><text class="t" x="1462.8400000000001" y="518.16" font-size="11.5" font-weight="700" text-anchor="end">Bein</text><polyline class="w" points="1321.4,613.92 1321.4,540.0 1474.04,540.0 1474.04,488.15999999999997 1172.6,488.15999999999997" stroke="#ff8a3c" stroke-width="4"/><polyline class="w" points="1172.6,492.0 774.2,492.0" stroke="#ff8a3c" stroke-width="4"/><polyline class="w" points="1332.92,613.92 1332.92,551.52 1483.6399999999999,551.52 1483.6399999999999,736.8 1115,736.8" stroke="#4fc3f7" stroke-width="4"/><polyline class="w" points="1115,732.96 827.0,732.96" stroke="#4fc3f7" stroke-width="4"/><circle cx="827.0" cy="734.88" r="15" fill="var(--sp-panel)" stroke="#ffe14d" stroke-width="2.5"/><circle cx="774.2" cy="490.08" r="15" fill="var(--sp-panel)" stroke="#ffe14d" stroke-width="2.5"/><circle cx="1115" cy="734.88" r="15" fill="var(--sp-panel)" stroke="#ffe14d" stroke-width="2.5"/><circle cx="1172.6" cy="490.08" r="15" fill="var(--sp-panel)" stroke="#ffe14d" stroke-width="2.5"/><text class="m" x="30" y="840" font-size="11.5" font-weight="800" letter-spacing="0.08em">HINWEISE</text><text class="t" x="30.0" y="864" font-size="12.5" font-weight="800">1.</text><text class="t" x="50.0" y="864" font-size="12.5" font-weight="400">Die Lautsprecherleitungen laufen von der Bar über das hintere rechte Bein (bei den Kühlschränken) nach oben und</text><text class="t" x="50.0" y="881" font-size="12.5" font-weight="400">dann in der Traverse.</text><text class="t" x="30.0" y="903" font-size="12.5" font-weight="800">2.</text><text class="t" x="50.0" y="903" font-size="12.5" font-weight="400">Der Amp liefert bis 600 W je Kanal, die Boxen vertragen 120 W. Amp-Regler auf etwa −12 dB und abkleben, am Pult</text><text class="t" x="50.0" y="920" font-size="12.5" font-weight="400">Limiter auf Main bei +10 dBu (dann höchstens rund 50 W je Box), Hochpass 80 Hz auf den Musikkanälen.</text><text class="t" x="30.0" y="942" font-size="12.5" font-weight="800">3.</text><text class="t" x="50.0" y="942" font-size="12.5" font-weight="400">Musik am Pult auf Mono stellen, damit vorn und hinten dasselbe läuft.</text><text class="t" x="815.0" y="864" font-size="12.5" font-weight="800">4.</text><text class="t" x="835.0" y="864" font-size="12.5" font-weight="400">Lautstärke an der Standgrenze: Musik höchstens 60 dB(A) (STATION), sonst höchstens 70 dB (FoF). Musik ist</text><text class="t" x="835.0" y="881" font-size="12.5" font-weight="400">GEMA-pflichtig.</text><text class="t" x="815.0" y="903" font-size="12.5" font-weight="800">5.</text><text class="t" x="835.0" y="903" font-size="12.5" font-weight="400">Am Boden von der Bar zum Bein alle Leitungen in der Kabelbrücke führen.</text><text class="m" x="30" y="986" font-size="11.5" font-weight="800" letter-spacing="0.08em">LEGENDE</text><line x1="120" y1="982" x2="158" y2="982" stroke="#ff8a3c" stroke-width="4" stroke-linecap="round"/><text class="t" x="166" y="986.5" font-size="12.5" font-weight="400">Lautsprecher Kanal A (NL2)</text><line x1="371.5" y1="982" x2="409.5" y2="982" stroke="#4fc3f7" stroke-width="4" stroke-linecap="round"/><text class="t" x="417.5" y="986.5" font-size="12.5" font-weight="400">Lautsprecher Kanal B (NL2)</text><line x1="623.0" y1="982" x2="661.0" y2="982" stroke="#f2c230" stroke-width="3" stroke-linecap="round"/><text class="t" x="669.0" y="986.5" font-size="12.5" font-weight="400">Tonleitung XLR</text><line x1="793.5" y1="982" x2="831.5" y2="982" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round"/><text class="t" x="839.5" y="986.5" font-size="12.5" font-weight="400">Klinke</text><polygon points="185,276 180,267 190,267" fill="#9a9a9a"/><rect class="pill" x="95.27000000000001" y="238" width="179.45999999999998" height="22" rx="11" stroke="#9a9a9a"/><text class="t" x="185" y="253.5" font-size="12" font-weight="700" text-anchor="middle">USB-C auf Klinke 3,5 mm</text><polygon points="185,410 180,401 190,401" fill="#f2c230"/><rect class="pill" x="130.37" y="370" width="109.25999999999999" height="22" rx="11" stroke="#f2c230"/><text class="t" x="185" y="385.5" font-size="12" font-weight="700" text-anchor="middle">2 x XLR 1,5 m</text><polygon points="185,596 180,587 190,587" fill="#f2c230"/><rect class="pill" x="137.39" y="554" width="95.22" height="22" rx="11" stroke="#f2c230"/><text class="t" x="185" y="569.5" font-size="12" font-weight="700" text-anchor="middle">2 x XLR 3 m</text><polygon points="310,472 319,467 319,477" fill="#f2c230"/><polygon points="850,188 841,183 841,193" fill="#ff8a3c"/><rect class="pill" x="704.92" y="177" width="74.16" height="22" rx="11" stroke="#ff8a3c"/><text class="t" x="742" y="192.5" font-size="12" font-weight="700" text-anchor="middle">NL2 10 m</text><polygon points="1270,188 1261,183 1261,193" fill="#ff8a3c"/><rect class="pill" x="1161.43" y="177" width="67.14" height="22" rx="11" stroke="#ff8a3c"/><text class="t" x="1195" y="192.5" font-size="12" font-weight="700" text-anchor="middle">NL2 5 m</text><polygon points="850,328 841,323 841,333" fill="#4fc3f7"/><rect class="pill" x="712.92" y="317" width="74.16" height="22" rx="11" stroke="#4fc3f7"/><text class="t" x="750" y="332.5" font-size="12" font-weight="700" text-anchor="middle">NL2 15 m</text><polygon points="1270,328 1261,323 1261,333" fill="#4fc3f7"/><rect class="pill" x="1161.43" y="317" width="67.14" height="22" rx="11" stroke="#4fc3f7"/><text class="t" x="1195" y="332.5" font-size="12" font-weight="700" text-anchor="middle">NL2 5 m</text><text class="t" x="827.0" y="739.38" font-size="11.5" font-weight="800" text-anchor="middle">S1</text><text class="t" x="774.2" y="494.58" font-size="11.5" font-weight="800" text-anchor="middle">S2</text><text class="t" x="1115" y="739.38" font-size="11.5" font-weight="800" text-anchor="middle">S3</text><text class="t" x="1172.6" y="494.58" font-size="11.5" font-weight="800" text-anchor="middle">S4</text></svg>