<svg class="sp" id="spVideo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img"><style>svg{--sp-bg:#ffffff;--sp-panel:#f4f4f4;--sp-line:#bdbdbd;--sp-fg:#111111;--sp-mut:#555555;--sp-zone:#8a8a8a;--sp-l2:#222222}.sp{font-family:"Helvetica Neue",Arial,sans-serif;display:block}
.sp .bg{fill:var(--sp-bg)}.sp .t{fill:var(--sp-fg)}.sp .m{fill:var(--sp-mut)}
.sp .hr{stroke:var(--sp-line);stroke-width:1.5}
.sp .dev{fill:var(--sp-panel);stroke:var(--sp-line);stroke-width:1.5}
.sp .chip{fill:var(--sp-panel);stroke-width:2}
.sp .zone{fill:none;stroke:var(--sp-zone);stroke-width:1.3;stroke-dasharray:6 5}
.sp .w{fill:none;stroke-linejoin:round;stroke-linecap:round}
.sp .pill{fill:var(--sp-bg);stroke-width:1.5}
.sp .barbg{fill:var(--sp-line)}
</style><rect class="bg" x="0" y="0" width="1600" height="1000"/><rect x="30" y="26" width="7" height="34" fill="#801624"/><text class="t" x="48" y="53" font-size="26" font-weight="900">SIGNALLAUFPLAN VIDEO</text><text class="m" x="1570" y="40" font-size="13.5" font-weight="400" text-anchor="end">FoF 2026, TSE Stand, STATION Berlin, Halle 1</text><text class="m" x="1570" y="59" font-size="13.5" font-weight="400" text-anchor="end">Auftrag 177433, Stand 23.11.2026, Material laut Packliste vom 21.11.2026</text><line class="hr" x1="30" y1="78" x2="1570" y2="78"/><rect class="zone" x="30" y="104" width="640" height="446" rx="10"/><rect class="bg" x="42" y="95" width="138.04" height="18"/><text class="m" x="50" y="108" font-size="11.5" font-weight="800" letter-spacing="0.08em">REGIE AN DER BAR</text><rect class="dev" x="60" y="140" width="250" height="70" rx="8"/><text class="t" x="74" y="164" font-size="15" font-weight="700">Stream Deck+</text><text class="m" x="74" y="183" font-size="12.5" font-weight="400">Stimmungen, Drehregler</text><rect class="dev" x="60" y="280" width="250" height="150" rx="8"/><rect x="60" y="288" width="4" height="134" fill="#801624"/><text class="t" x="74" y="304" font-size="15" font-weight="700">Show-Rechner</text><text class="m" x="74" y="323" font-size="12.5" font-weight="400">Showcontrol im Browser Edge</text><text class="m" x="74" y="340" font-size="12.5" font-weight="400">Laptop-Display: Dashboard</text><text class="m" x="74" y="357" font-size="12.5" font-weight="400">Fenster quer: Screen 98 Zoll</text><text class="m" x="74" y="374" font-size="12.5" font-weight="400">Fenster hoch: Screen 55 Zoll</text><text class="m" x="74" y="391" font-size="12.5" font-weight="400">Start mit start.bat</text><rect class="dev" x="410" y="300" width="230" height="110" rx="8"/><text class="t" x="424" y="324" font-size="15" font-weight="700">Bildausgänge</text><text class="m" x="424" y="343" font-size="12.5" font-weight="400">Dockingstation oder</text><text class="m" x="424" y="360" font-size="12.5" font-weight="400">Adapter USB-C auf HDMI.</text><text class="m" x="424" y="377" font-size="12.5" font-weight="400">Zwei Ausgänge nötig.</text><polyline class="w" points="185,210 185,280" stroke="#9a9a9a" stroke-width="3"/><polyline class="w" points="310,355 410,355" stroke="#9a9a9a" stroke-width="3"/><rect class="dev" x="1040" y="120" width="530" height="180" rx="8"/><text class="t" x="1054" y="215.0" font-size="15" font-weight="700"></text><rect x="1060.0" y="170.0" width="140" height="80" rx="3" fill="#801624" stroke="var(--sp-fg)" stroke-width="2"/><text class="t" x="1130" y="215.0" font-size="12" font-weight="800" text-anchor="middle">QUER</text><text x="1130" y="215.0" font-size="12" font-weight="800" text-anchor="middle" fill="#fff">QUER</text><text class="t" x="1230" y="154" font-size="16" font-weight="800">Display 98 Zoll, quer</text><text class="m" x="1230" y="176" font-size="12.5" font-weight="400">iiyama LH9875UHS, 3840 x 2160</text><text class="m" x="1230" y="194" font-size="12.5" font-weight="400">abgehängt an der hinteren Traverse</text><text class="m" x="1230" y="212" font-size="12.5" font-weight="400">Windows-Anzeige: Querformat</text><text class="m" x="1230" y="230" font-size="12.5" font-weight="400">Content 1920 x 1080, wird hochgezogen</text><rect class="dev" x="1040" y="350" width="530" height="200" rx="8"/><text class="t" x="1054" y="455.0" font-size="15" font-weight="700"></text><rect x="1090.0" y="380.0" width="80" height="140" rx="3" fill="#801624" stroke="var(--sp-fg)" stroke-width="2"/><text class="t" x="1130" y="455.0" font-size="12" font-weight="800" text-anchor="middle">HOCH</text><text x="1130" y="455.0" font-size="12" font-weight="800" text-anchor="middle" fill="#fff">HOCH</text><text class="t" x="1230" y="384" font-size="16" font-weight="800">Display 55 Zoll, hochkant</text><text class="m" x="1230" y="406" font-size="12.5" font-weight="400">Samsung QM55C</text><text class="m" x="1230" y="424" font-size="12.5" font-weight="400">am vorderen linken Bein</text><text class="m" x="1230" y="442" font-size="12.5" font-weight="400">Windows-Anzeige: Hochformat</text><text class="m" x="1230" y="460" font-size="12.5" font-weight="400">Content 1080 x 1920, synchron zum 98er</text><polyline class="w" points="640,330 840,330 840,210 1040,210" stroke="#ff4fa3" stroke-width="3.5"/><polyline class="w" points="640,380 840,380 840,450 1040,450" stroke="#ff4fa3" stroke-width="3.5"/><text class="m" x="648" y="323" font-size="10.5" font-weight="700">Ausgang 1</text><text class="m" x="648" y="398" font-size="10.5" font-weight="700">Ausgang 2</text><rect class="zone" x="30" y="596" width="740" height="216" rx="10"/><rect class="bg" x="42" y="587" width="69.39249999999998" height="18"/><text class="m" x="50" y="600" font-size="11.5" font-weight="800" letter-spacing="0.08em">RESERVE</text><rect class="dev" x="60" y="630" width="250" height="84" rx="8" stroke-dasharray="6 4"/><text class="t" x="74" y="654" font-size="15" font-weight="700">Mediaplayer Molitor MP01</text><text class="m" x="74" y="673" font-size="12.5" font-weight="400">Full HD, spielt vom USB-Stick</text><text class="m" x="74" y="690" font-size="12.5" font-weight="400">nicht synchron zum Licht</text><rect class="dev" x="480" y="630" width="260" height="84" rx="8" stroke-dasharray="6 4"/><text class="t" x="494" y="654" font-size="15" font-weight="700">Ein Display im Notbetrieb</text><text class="m" x="494" y="673" font-size="12.5" font-weight="400">98 Zoll oder 55 Zoll</text><text class="m" x="494" y="690" font-size="12.5" font-weight="400">falls der Show-Rechner ausfällt</text><polyline class="w" points="310,672 480,672" stroke="#ff4fa3" stroke-width="3"/><text class="m" x="60" y="750" font-size="12.5" font-weight="400">Kabelreserve: 2 x HDMI Glasfaser 10 m, 2 x HDMI 5 m, 3 x HDMI 2 m, 1 x HDMI 1 m</text><text class="m" x="60" y="772" font-size="12.5" font-weight="400">Adapter USB-C auf HDMI als zweiter Weg für einen Bildausgang</text><rect class="zone" x="830" y="596" width="740" height="216" rx="10"/><rect class="bg" x="842" y="587" width="168.54999999999998" height="18"/><text class="m" x="850" y="600" font-size="11.5" font-weight="800" letter-spacing="0.08em">TETRIS, EIGENSTÄNDIG</text><rect class="dev" x="860" y="630" width="250" height="64" rx="8"/><text class="t" x="874" y="654" font-size="15" font-weight="700">Tetris-Rechner</text><text class="m" x="874" y="673" font-size="12.5" font-weight="400">ThinkBook, eigener Content</text><rect class="dev" x="860" y="728" width="250" height="60" rx="8"/><text class="t" x="874" y="752" font-size="15" font-weight="700">StreamDeck Studio</text><text class="m" x="874" y="771" font-size="12.5" font-weight="400">32 Tasten</text><rect class="dev" x="1290" y="630" width="250" height="84" rx="8"/><text class="t" x="1304" y="654" font-size="15" font-weight="700">Display 55 Zoll, hochkant</text><text class="m" x="1304" y="673" font-size="12.5" font-weight="400">Samsung QM55C</text><text class="m" x="1304" y="690" font-size="12.5" font-weight="400">auf Displaystativ neben dem Stand</text><polyline class="w" points="1110,662 1290,662" stroke="#ff4fa3" stroke-width="3"/><polyline class="w" points="985,728 985,694" stroke="#9a9a9a" stroke-width="3"/><text class="m" x="30" y="860" font-size="11.5" font-weight="800" letter-spacing="0.08em">HINWEISE</text><text class="t" x="30.0" y="884" font-size="12.5" font-weight="800">1.</text><text class="t" x="50.0" y="884" font-size="12.5" font-weight="400">Beide HDMI-Kabel laufen über das hintere rechte Bein (bei den Kühlschränken) nach oben und dann in der Traverse</text><text class="t" x="50.0" y="901" font-size="12.5" font-weight="400">zu den Displays.</text><text class="t" x="30.0" y="923" font-size="12.5" font-weight="800">2.</text><text class="t" x="50.0" y="923" font-size="12.5" font-weight="400">Glasfaserkabel haben eine Richtung. Der Stecker mit „Source“ gehört an den Rechner, der mit „Display“ an den</text><text class="t" x="50.0" y="940" font-size="12.5" font-weight="400">Screen.</text><text class="t" x="30.0" y="962" font-size="12.5" font-weight="800">3.</text><text class="t" x="50.0" y="962" font-size="12.5" font-weight="400">Den 55er in den Windows-Anzeigeeinstellungen auf Hochformat drehen, Skalierung beider Displays auf 100 %.</text><text class="t" x="815.0" y="884" font-size="12.5" font-weight="800">4.</text><text class="t" x="835.0" y="884" font-size="12.5" font-weight="400">Beide Screens und das Licht laufen auf derselben Show-Uhr im Rechner. Ein Sync-Kabel gibt es nicht.</text><text class="t" x="815.0" y="906" font-size="12.5" font-weight="800">5.</text><text class="t" x="835.0" y="906" font-size="12.5" font-weight="400">start.bat legt Dashboard und beide Screen-Fenster auf die Displays. Passt die Zuordnung nicht: Positionen in</text><text class="t" x="835.0" y="923" font-size="12.5" font-weight="400">start.json.</text><text class="t" x="815.0" y="945" font-size="12.5" font-weight="800">6.</text><text class="t" x="835.0" y="945" font-size="12.5" font-weight="400">Das Kabel zum 55er ist mit rund 17 m von 20 m knapp. Nicht in Schlaufen legen.</text><text class="m" x="30" y="976" font-size="11.5" font-weight="800" letter-spacing="0.08em">LEGENDE</text><line x1="120" y1="972" x2="158" y2="972" stroke="#ff4fa3" stroke-width="3.5" stroke-linecap="round"/><text class="t" x="166" y="976.5" font-size="12.5" font-weight="400">HDMI</text><line x1="223.0" y1="972" x2="261.0" y2="972" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round"/><text class="t" x="269.0" y="976.5" font-size="12.5" font-weight="400">USB und USB-C</text><polygon points="185,280 180,271 190,271" fill="#9a9a9a"/><rect class="pill" x="165.47" y="234" width="39.06" height="22" rx="11" stroke="#9a9a9a"/><text class="t" x="185" y="249.5" font-size="12" font-weight="700" text-anchor="middle">USB</text><polygon points="410,355 401,350 401,360" fill="#9a9a9a"/><rect class="pill" x="333.45" y="344" width="53.099999999999994" height="22" rx="11" stroke="#9a9a9a"/><text class="t" x="360" y="359.5" font-size="12" font-weight="700" text-anchor="middle">USB-C</text><polygon points="1040,210 1031,205 1031,215" fill="#ff4fa3"/><rect class="pill" x="864.31" y="199" width="151.38" height="22" rx="11" stroke="#ff4fa3"/><text class="t" x="940" y="214.5" font-size="12" font-weight="700" text-anchor="middle">HDMI Glasfaser 20 m</text><text class="m" x="940" y="237" font-size="11.5" font-weight="400" text-anchor="middle">Weg rund 11,5 m</text><polygon points="1040,450 1031,445 1031,455" fill="#ff4fa3"/><rect class="pill" x="864.31" y="439" width="151.38" height="22" rx="11" stroke="#ff4fa3"/><text class="t" x="940" y="454.5" font-size="12" font-weight="700" text-anchor="middle">HDMI Glasfaser 20 m</text><text class="m" x="940" y="477" font-size="11.5" font-weight="400" text-anchor="middle">Weg rund 17 m</text><polygon points="480,672 471,667 471,677" fill="#ff4fa3"/><rect class="pill" x="357.92" y="661" width="74.16" height="22" rx="11" stroke="#ff4fa3"/><text class="t" x="395" y="676.5" font-size="12" font-weight="700" text-anchor="middle">HDMI 2 m</text><polygon points="1290,662 1281,657 1281,667" fill="#ff4fa3"/><rect class="pill" x="1162.92" y="651" width="74.16" height="22" rx="11" stroke="#ff4fa3"/><text class="t" x="1200" y="666.5" font-size="12" font-weight="700" text-anchor="middle">HDMI 5 m</text><polygon points="985,694 980,703 990,703" fill="#9a9a9a"/><rect class="pill" x="965.47" y="700" width="39.06" height="22" rx="11" stroke="#9a9a9a"/><text class="t" x="985" y="715.5" font-size="12" font-weight="700" text-anchor="middle">USB</text></svg>