<style>
:root{--bg:#111;--panel:#1c1c1c;--card:#202020;--line:#333;--text:#fafafa;--muted:#a9a9a9;--red:#801624;--hi:#ff5a6a}

a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}

#go{width:100%;margin-top:12px;min-height:52px;border:0;border-radius:10px;background:var(--red);font-weight:800;font-size:17px}

#msg{min-height:22px;color:var(--hi);font-size:14px;margin-top:10px}
#app{display:none;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(17,17,17,0.96);backdrop-filter:blur(6px);display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}

header a.hb{text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:40px;display:inline-flex;align-items:center;font-size:13px;color:#fff;font-weight:700}

main{max-width:720px;margin:0 auto;padding:12px 14px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#161616;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}

.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:2px 0 12px}
.days button{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:4px 2px;line-height:1.15}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px}

.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:0 2px 8px}

.share{display:grid;grid-template-columns:168px minmax(0,1fr);gap:14px;align-items:center;margin-top:10px}

.nowl{position:relative;height:0;border-top:2px solid #fff;margin:6px 0}

25Mm0cHz3Esys99l8wE2IFYRwYc+1gtxnAG+XKQ0DiXesG50mAbv+lTq/99hbsPznfN6ZqA/ulmYee"};var BUILD='27.11. 08:40';var SIU={"doc": "PA-F 0303", "va": "FOF 2026, TSE Stand", "zr": "23.11. bis 27.11.2026", "ort": "STATION Berlin", "dat": "22.11.2026", "sup": "Friedrich Reiß", "supr": "Projektleitung, TSE AG", "list": ["M.DOERSCHE", "A.DUNKEL", "N.GARNEK", "S.HOLZ", "A.IMAMOVIC", "L.KOHN", "T.KUBAN", "P.PETRUSCH", "F.REIß", "J.SCHMIDT", "S.WINGERAT", "S.ZAUCKER", "N.GOBRY", "A.FRIEDMAN"], "s": [["Unterweisung zum Arbeits- und Gesundheitsschutz", "<p>Alle Mitarbeitenden der TSE AG sowie Subunternehmen und Dienstleister/-innen verpflichten sich während des gesamten Produktionszeitraums zur Einhaltung der geltenden Vorschriften für Arbeits- und Gesundheitsschutz sowie der geltenden Sicherheitsvorschriften, um im Sinne der allgemeinen Gefahrenreduzierung zu handeln.<\/p><p>Die vorliegende Arbeits-, Brandschutz- und Sicherheitsunterweisung ist Bestandteil und rechtliche Grundlage deiner Arbeitstätigkeit auf dieser Produktion. Es liegt im Interesse aller Beteiligten, dass die technischen und sicherheitstechnischen Regeln eingehalten werden. Das dient deiner eigenen Sicherheit und der deiner Kolleg/-innen, einem reibungslosen Ablauf aller Produktionsschritte und der Einhaltung des Zeitplans. Arbeitsunfälle können neben den persönlichen Folgen für die verunfallte Person auch einen tagelangen Stillstand der Produktion bedeuten. Mit der Einhaltung der Regeln und, wo nötig, mit Hinweisen an deine Kolleg/-innen sicherst du auch dein Arbeitsverhältnis.<\/p><p><b>Sicherheitsrelevante Hinweise und insbesondere Weisungen der verantwortlichen Person (z.B. Produktions-, Gewerke- oder Projektleitung, Verantwortliche/-r oder Meister/-in für Veranstaltungstechnik) sind uneingeschränkt einzuhalten.<\/b><\/p>"], ["Projektbeschreibung", "<p>Wir bauen auf der Messe Future of Festivals unseren eigenen TSE-Stand auf (STATION Berlin, Halle 1). Alle Gewerke sind beteiligt: Rigging und Traverse, Licht, Ton, Video, Strom, Deko und Bar.<\/p>"], ["Persönliche Schutzausrüstung (PSA und PSAgA)", "<p>Die PSA muss zu jedem Arbeitseinsatz mitgebracht und je nach Produktionsphase wie unten beschrieben benutzt werden. Dazu gehören:<\/p><ul><li>Schutzhelm, wenn die Gefahr von Kopfverletzungen besteht (z.B. durch herabfallende Gegenstände, Höhenarbeiten in unmittelbarer Umgebung oder Traversen auf Arbeitshöhe)<\/li><li>Arbeitsschutzschuhe bei Auf-, Um- und Abbau sowie bei Ladetätigkeiten<\/li><li>Schutzhandschuhe bei Arbeiten mit scharfkantigen, splitternden Gegenständen und bei hautschädigenden Tätigkeiten<\/li><li>Arbeitssicherheitsgurt bei Höhenarbeiten, im Gelenksteiger und in einer Hubarbeitsbühne, bei der es der Hersteller vorschreibt<\/li><li>Gehörschutz bei einem Schalldruckpegel über 85 dB(A)<\/li><\/ul><p><b>Phase 1: Auf- und Abbau, Ladetätigkeiten.<\/b> Die PSA muss in allen Bereichen getragen werden, in denen gebaut oder geladen wird. Einzelne Bereiche können durch eine verantwortliche Person freigegeben werden.<\/p><p><b>Phase 2: Proben, Restarbeiten, Einrichtung.<\/b> Die Aufbauarbeiten sind zum Großteil abgeschlossen. PSA ist nicht mehr notwendig, außer bei sicherheitsrelevanten Restarbeiten (z.B. Einleuchten) im entsprechenden Bereich.<\/p><p><b>Phase 3: Veranstaltung.<\/b> Alle Aufbautätigkeiten sind abgeschlossen. PSA ist nicht notwendig. Bei sicherheitsrelevanten Arbeiten (z.B. Austausch von Material) muss die PSA getragen werden.<\/p><p>Hinweis an alle freiberuflich tätigen Techniker/-innen: Die Unfallverhütungsvorschriften gelten ausdrücklich auch für nicht angestellte Personen (§ 16 SGB VII). Weitere Hinweise unter www.dguv.de.<\/p>"], ["Schutz gegen herabfallende Gegenstände", "<p>Aufzuhängende Gegenstände sind so zu befestigen, dass sie sich nicht selbsttätig lösen können. Sie müssen mit einer Sekundärsicherung versehen werden. Beim Einsatz von Drahtseilen ist die maximale Fallhöhe von 20 cm zwingend einzuhalten.<\/p><p>Arbeitsmittel sind bei Arbeiten in der Höhe so zu verstauen und zu sichern, dass nichts herabfallen kann und keine Person gefährdet wird.<\/p>"], ["Arbeitsgeräte und Hubarbeitsbühnen", "<p>Arbeitsbühnen dürfen nur von qualifiziertem Personal mit gültigem Befähigungsnachweis (z.B. PAL-Card) benutzt werden. Umsichtig fahren, Fahrbereiche frei von Gegenständen halten und Gefahrenbereiche bei Bedarf kennzeichnen. Vor der Benutzung eine Sicht- und Funktionsprüfung machen. Nach der Benutzung die Bühne abschließen, damit niemand sie unbefugt oder versehentlich bedient.<\/p>"], ["Umgang mit elektrischen Geräten", "<p>Vor jedem Einsatz wird das Material einer Sichtprüfung unterzogen. Augenscheinlich defektes Material sofort aussortieren, eindeutig kennzeichnen und an <b>schaden@tse-ag.com<\/b> melden. Stromanschlüsse vor der ersten Inbetriebnahme auf korrekte Funktion prüfen.<\/p>"], ["Kabelverlegung", "<p>Kabelwege so anlegen, dass niemand stürzen kann und keine Gefahr für Personen entsteht. Stolperstellen abdecken und kennzeichnen. Senkrechte Kabelwege abfangen und an scharfen Kanten zusätzlich gegen Knicken schützen.<\/p>"], ["Alkohol und Drogen", "<p><b>Der Konsum von Alkohol, Drogen oder anderen berauschenden Mitteln ist verboten.<\/b><\/p>"], ["Flucht- und Rettungswege", "<p>Verkehrs-, Flucht- und Rettungswege sind immer frei von Gegenständen zu halten. Mach dich mit den Flucht- und Rettungswegen vertraut. Alle Notausgänge sind gekennzeichnet.<\/p>"], ["Vorbeugender Brandschutz und Feuerwehr", "<p>Rauchen ist im gesamten Produktionsbereich verboten und nur auf ausgewiesenen Flächen oder außerhalb des Gebäudes erlaubt. Feuer und offenes Licht sind ebenfalls nicht gestattet.<\/p><p>Brände sofort melden und mit den vorhandenen Feuerlöscheinrichtungen bekämpfen. Mach dich mit den Positionen der Feuerlöscher vertraut. Feuerlöscheinrichtungen dürfen nicht verdeckt werden.<\/p><p><b>Verhalten bei Ausbruch von Feuer<\/b><\/p><ol><li><b>Ruhe bewahren<\/b><\/li><li><b>Brand melden:<\/b> Wer meldet? Wo ist es passiert? Was ist geschehen? Wie viele Personen sind betroffen oder verletzt? Auf Rückfragen warten. Brandmelder betätigen.<\/li><li><b>In Sicherheit bringen:<\/b> nicht rennen, gefährdete und verletzte Personen in Sicherheit bringen, Türen schließen, den gekennzeichneten Rettungswegen ins Freie folgen, keine Aufzüge benutzen, Anweisungen des Sicherheitspersonals folgen, das Gebäude erst nach Entwarnung wieder betreten.<\/li><li><b>Löschversuch:<\/b> niemals allein, Feuerlöscher nur benutzen, wenn keine Gefahr für das eigene Leben besteht.<\/li><\/ol><p class=\"em\">Notruf Feuerwehr: 112<\/p>"], ["Sanitäter/-innen, medizinische Versorgung und Verhalten bei Unfällen", "<p>Bei Unfällen sofort Hilfe leisten und Ersthelfer/-innen oder Sanitäter/-innen holen. Mach dich mit den Standorten von Verbandskästen, Defibrillatoren und dem Erste-Hilfe-Case vertraut. Unfälle und Beinahe-Unfälle sofort der vorgesetzten Person melden.<\/p><p><b>Verhalten bei Unfällen<\/b><\/p><ol><li><b>Ruhe bewahren<\/b><\/li><li><b>Unfall melden:<\/b> Wer meldet? Wo geschah es? Was geschah? Wie viele Verletzte? Welche Verletzungen? Auf Rückfragen warten.<\/li><li><b>Erste Hilfe:<\/b> Unfallort absichern, Verletzte versorgen, Anweisungen beachten.<\/li><li><b>Weitere Maßnahmen:<\/b> Rettungsdienst einweisen, Schaulustige entfernen.<\/li><\/ol>"], ["Sicherheitszeichen", "<p>Sicherheitszeichen kennzeichnen Arbeitsschutzmaßnahmen, Warnungen, Rettungswege und Ähnliches. Entfernen, Überkleben oder Umbauen ist verboten.<\/p>"], ["Unterlagen der Berufsgenossenschaften", "<p>Weiterführende Unterlagen gibt es jederzeit unter www.dguv.de und www.vbg.de.<\/p>"], ["Gesetzliche Grundlagen", "<p>Vor Arbeitsbeginn auf der Produktion werden alle Mitarbeitenden durch die zuständige Gewerke- oder Projektleitung unterwiesen. Wer später dazukommt, wird ebenfalls vor Beginn der Tätigkeit unterwiesen. Die Gewerke- oder Projektleitung ist für die Einhaltung und Kenntnis der gültigen technischen Regeln und Sicherheitsrichtlinien ihres Personals vor Ort verantwortlich und lässt sich das per Unterschrift bestätigen. <b>Nur wer mit Unterschrift Kenntnis und Verständnis der Unterweisung bestätigt hat, darf die Produktionsstätte betreten.<\/b><\/p><p>Die Unterschriftenlisten sind auf Verlangen vorzuzeigen und nach Abschluss der Produktion in die Firma zu überführen. Die unterweisende Gewerke- oder Projektleitung erklärt mit ihrer Unterschrift, dass sie ihre Aufgaben als verantwortliche Aufsichtsperson wahrnimmt und in ihrem Bereich für die Befolgung der Sicherheitsregeln sorgt.<\/p><p>Rechtliche und normative Grundlagen:<\/p><ul><li>DGUV Vorschrift 1<\/li><li>DGUV Vorschriften 3 bis 5<\/li><li>DGUV Vorschriften 17 und 18<\/li><li>Arbeitsschutzgesetz (ArbSchG)<\/li><li>Betriebssicherheitsverordnung, Stand 7/2015 (BetrSichV)<\/li><li>DGUV Regel 112-191: Fuß- und Knieschutz<\/li><li>DGUV Regel 112-192: Augen- und Gesichtsschutz<\/li><li>DGUV Regel 112-193: Kopfschutz<\/li><li>DGUV Regel 112-194: Gehörschutz<\/li><li>DGUV Regel 112-195: Schutzhandschuhe<\/li><li>DGUV Regel 112-198: PSA gegen Absturz<\/li><li>DGUV Regel 112-199: Retten aus Höhen und Tiefen<\/li><li>DGUV Information 204-022: Erste Hilfe im Betrieb<\/li><li>DGUV Information 205-001: Vorbeugender Brandschutz<\/li><li>DGUV Information 208-019: Fahrbare Arbeitsbühnen (vormals BGI 720)<\/li><li>Versammlungsstättenverordnung (Bundesland)<\/li><li>Bauordnung (Bundesland)<\/li><\/ul>"]], "ok": "Mit meiner Unterschrift bestätige ich, dass ich den Inhalt dieser Unterweisung zur Kenntnis genommen und verstanden habe."};var PHX={};
