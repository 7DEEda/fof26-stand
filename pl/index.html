<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>FoF 26: Projektleitung</title>
<style>
:root{--bg:#111;--panel:#1c1c1c;--card:#202020;--line:#333;--text:#fafafa;--muted:#a9a9a9;--red:#801624;--hi:#ff5a6a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
#lock h1{font-size:26px;font-weight:900;text-transform:uppercase;border-left:6px solid var(--red);padding-left:12px;margin:0 0 6px;line-height:1.1}
#lock p{color:var(--muted);margin:0 0 22px;font-size:14px}
#pw{width:100%;font:inherit;font-size:20px;letter-spacing:0.15em;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
#pw:focus{outline:2px solid #fff;outline-offset:1px}
#go{width:100%;margin-top:12px;min-height:52px;border:0;border-radius:10px;background:var(--red);font-weight:800;font-size:17px}
#go:disabled{opacity:0.6}
#msg{min-height:22px;color:var(--hi);font-size:14px;margin-top:10px}
#app{display:none;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(17,17,17,0.96);backdrop-filter:blur(6px);display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
header b{font-weight:900;text-transform:uppercase;font-size:16px;border-left:5px solid var(--red);padding-left:9px;white-space:nowrap}
header span{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
header a.hb{text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:#fff;font-weight:700}
header button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:12px 14px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#161616;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{background:none;border:0;min-height:60px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav#tabs button svg{width:22px;height:22px}
nav#tabs button.on{color:#fff}
nav#tabs button.on svg{color:var(--hi)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:2px 0 12px}
.days button{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:4px 2px;line-height:1.15}
.days button b{display:block;font-size:16px}
.days button small{display:block;font-size:11px;color:var(--muted)}
.days button.on{background:var(--red);border-color:var(--red)}
.days button.on small{color:#f3d6da}
.days button.today{box-shadow:inset 0 -3px 0 #fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px}
.card h2{margin:0;font-size:20px;font-weight:900;text-transform:uppercase}
.card .sub{color:var(--muted);font-size:14px;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px;margin-top:8px}
.kv span{color:var(--muted)}
.lbl{font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.p{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a2a}
.p:last-child{border-bottom:0}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#3a3a3a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#ddd}
.p .n{font-weight:700;font-size:16px}
.p .r{color:var(--muted);font-size:13px}
.p .tm{font-size:13.5px;margin-top:1px}
.p .tm.late{color:#ffb4bc}
.acts{display:flex;gap:6px}
.ic{width:44px;height:44px;border-radius:50%;background:#2c2c2c;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-decoration:none}
.ic.wa{background:#1f5f3a;border-color:#2b7a4b}
#face .btn.wa,.tr .btn.wa{background:#1f5f3a;border-color:#2b7a4b}
.ic.call{background:var(--red);border-color:var(--red)}
.ic svg{width:20px;height:20px}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{font-style:normal;font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;background:#2a2a2a;color:#6f6f6f}
.dots i.on{background:#3a1218;color:#ffd0d6}
.tr .big{font-size:22px;font-weight:900}
.tr .what{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;background:var(--red);border-radius:5px;padding:2px 7px;margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;background:#2c2c2c;border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:14.5px}
.btn.red{background:var(--red);border-color:var(--red)}
.btn svg{width:18px;height:18px}
.warn{border-left:4px solid var(--hi)}
.warn b{display:block;margin-bottom:3px}
.warn p{margin:0;color:#d6d6d6;font-size:14.5px}
.note{color:var(--muted);font-size:12.5px;text-align:center;margin:18px 0 6px}
.mini{font-size:14px;color:#d6d6d6;margin-top:6px}
.tk{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a2a}
.tk:last-child{border-bottom:0}
.tk img.q{width:56px;height:56px;background:#fff;border-radius:6px;padding:3px;image-rendering:pixelated}
.tk .q0{width:56px;height:56px;border-radius:6px;border:1px dashed #555;display:flex;align-items:center;justify-content:center;color:#777;font-size:11px;text-align:center;line-height:1.1}
.tk .n{font-weight:700}
.tk .r{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.ok{background:#173a22;color:#9fe3b3}
.tag.no{background:#3a1218;color:#ffb4bc}
#qrv{position:fixed;inset:0;z-index:20;background:#fff;color:#111;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#qrv img{width:min(78vw,60vh);height:auto;image-rendering:pixelated}
#qrv b{font-size:22px;margin-top:18px}
#qrv small{font-size:15px;color:#444;margin-top:4px}
#qrv p{color:#666;font-size:13px;margin-top:26px}
img.av{cursor:zoom-in}
#face{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#face img{width:min(82vw,52vh);height:min(82vw,52vh);object-fit:cover;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
#face b{font-size:24px;margin-top:18px}
#face small{color:var(--muted);font-size:15px;margin-top:2px}
#face .btns{justify-content:center;margin-top:18px}
#face p{color:#777;font-size:13px;margin-top:18px}
.ck{width:44px;height:44px;border-radius:10px;border:2px solid #555;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.ck svg{width:24px;height:24px;opacity:0}
.ck.on{background:#1f7a45;border-color:#1f7a45}
.ck.on svg{opacity:1}
.tk.done .n,.tk.done .r,.tk.done img.q{opacity:0.45}
.tk .side{display:flex;gap:6px;align-items:center}
.prog{height:6px;background:#2a2a2a;border-radius:3px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:#1f7a45}
#face .fnum{display:block;font-size:30px;font-weight:800;color:#fff;text-decoration:none;margin-top:12px;letter-spacing:0.02em;user-select:all;-webkit-user-select:all}
#face button.btn{font:inherit;font-weight:700;font-size:14.5px;color:#fff}
.p .ph{color:var(--muted);font-size:13px;margin-top:1px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="lock">
<h1>FoF 26<br>Projektleitung</h1>
<p>Interner Bereich mit Crew, Zeiten, Tickets und Transporten.</p>
<p style="margin-top:-12px"><a href="../" style="color:var(--muted)">Zurück zur Stand-Ansicht</a></p>
<form id="f" autocomplete="off">
<input id="pw" type="password" placeholder="Passwort" aria-label="Passwort" autocomplete="current-password">
<button id="go" type="submit">Entsperren</button>
</form>
<div id="msg" role="status"></div>
</div>
<div id="app">
<header><b>FoF 26 PL</b><span id="stamp"></span><a class="hb" href="../">Stand</a><button onclick="lockNow()">Sperren</button></header>
<main id="view"></main>
<div id="face" role="dialog" onclick="if(event.target===this||event.target.tagName==='IMG'||event.target.id==='fx'){this.style.display='none'}"><img id="fi" alt=""><div id="fx" style="display:none;width:min(60vw,40vh);height:min(60vw,40vh);border-radius:50%;background:#3a3a3a;align-items:center;justify-content:center;font-size:64px;font-weight:900"></div><b id="fn"></b><small id="fr"></small><a id="fnum" class="fnum"></a><div class="btns" id="fb"></div><p>Antippen zum Schließen</p></div>
<div id="qrv" onclick="this.style.display='none'" role="dialog"><img id="qri" alt="Ticket-Code"><b id="qrn"></b><small id="qrm"></small><p>Antippen zum Schließen. Bildschirm hell stellen.</p></div>

<button data-t="tix" onclick="tab('tix')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>Tickets</button>

</nav>

}
async function tryPw(pw,quiet){
var go=document.getElementById('go'),msg=document.getElementById('msg');
if(!window.crypto||!crypto.subtle){msg.textContent='Dieser Browser kann den Bereich nicht öffnen. Bitte Chrome oder Safari verwenden.';return;}
go.disabled=true;go.textContent='Entsperre';msg.textContent='';
try{DATA=await unlock(pw);try{localStorage.setItem('fofpl',pw);}catch(e){}start();}
catch(e){if(!quiet){msg.textContent='Passwort falsch.';}try{localStorage.removeItem('fofpl');}catch(e2){}}
go.disabled=false;go.textContent='Entsperren';
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var v=document.getElementById('pw').value.trim();if(v){tryPw(v);}});
function lockNow(){try{localStorage.removeItem('fofpl');}catch(e){}DATA=null;document.getElementById('view').innerHTML='';document.getElementById('app').style.display='none';document.getElementById('lock').style.display='flex';document.getElementById('pw').value='';}
function start(){
DATA.p.forEach(function(p){PK[p.k]=p;});
document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';
document.getElementById('stamp').textContent='Auftrag '+DATA.i.auf;
var td=new Date(),iso=td.getFullYear()+'-'+('0'+(td.getMonth()+1)).slice(-2)+'-'+('0'+td.getDate()).slice(-2);
DAY=0;DATA.d.forEach(function(d,i){if(d.d===iso){DAY=i;}});if(iso>DATA.d[DATA.d.length-1].d){DAY=DATA.d.length-1;}
tab('tage');
}
function av(p){return p.ph?'<img class="av" src="'+p.ph+'" alt="Foto '+esc(p.f)+'" onclick="face(\''+p.k+'\')">':'<div class="av" onclick="face(\''+p.k+'\')" style="cursor:pointer">'+esc(p.f[0]+p.l[0])+'</div>';}
var UA=navigator.userAgent||'',PHONE=/iPhone|iPod|Windows Phone|Android.+Mobile/i.test(UA)&&!/iPad|Tablet/i.test(UA);
var POP=[];
var I_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
function card(o){var fi=document.getElementById('fi'),fx=document.getElementById('fx');if(o.ph){fi.src=o.ph;fi.style.display='';fx.style.display='none';}else{fi.style.display='none';fx.style.display='flex';fx.textContent=o.ini;}
document.getElementById('fn').innerHTML=o.nh;document.getElementById('fr').textContent=o.r;document.getElementById('fnum').textContent=o.t;document.getElementById('fnum').href=PHONE?tel(o.t):'#';
document.getElementById('fb').innerHTML=(PHONE?'<a class="btn red" href="'+tel(o.t)+'">'+I_CALL+'Anrufen</a>':'')+'<a class="btn wa" href="'+wa(o.t)+'" target="_blank" rel="noopener">'+I_WA+'WhatsApp</a><button class="btn" onclick="cp(this,\''+o.t+'\')">'+I_COPY+'Kopieren</button>'+(o.m?'<a class="btn" href="mailto:'+esc(o.m)+'">'+I_MAIL+'Mail</a>':'');document.getElementById('face').style.display='flex';}
function cp(b,t){var done=function(){b.lastChild.textContent='Kopiert';};if(navigator.clipboard){navigator.clipboard.writeText(t).then(done,function(){});}else{var x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done();}catch(e){}x.remove();}}
function face(k){var p=PK[k];if(!p){return;}card({ph:p.ph,ini:p.f[0]+p.l[0],nh:nm(p),r:p.r,t:p.t,m:p.m});}
function pop(i){var o=POP[i];if(o.k){face(o.k);}else{card({ini:o.n.split(' ').map(function(w){return w[0];}).join('').slice(0,2),nh:esc(o.n),r:o.r,t:o.t,m:o.m});}}
function byName(n){return DATA.p.filter(function(p){return p.f+' '+p.l===n;})[0];}
function callA(cls,t,inner,aria,o){if(PHONE){return '<a class="'+cls+'" href="'+tel(t)+'"'+(aria?' aria-label="'+esc(aria)+'"':'')+'>'+inner+'</a>';}POP.push(o);return '<button class="'+cls+'" onclick="pop('+(POP.length-1)+')"'+(aria?' aria-label="'+esc(aria)+'"':'')+'>'+inner+'</button>';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('face').style.display='none';document.getElementById('qrv').style.display='none';}});
function nm(p){return esc(p.f+' '+p.l)+(p.nick?' <span style="color:var(--muted);font-weight:400">('+esc(p.nick)+')</span>':'');}
function acts(p){return '<div class="acts"><a class="ic wa" href="'+wa(p.t)+'" target="_blank" rel="noopener" aria-label="WhatsApp an '+esc(p.f)+'">'+I_WA+'</a>'+callA('ic call',p.t,I_CALL,p.f+' anrufen',{k:p.k})+'</div>';}
function hrs(a,b){var x=+a.slice(0,2)+a.slice(3)/60,y=+b.slice(0,2)+b.slice(3)/60;if(y<=x){y+=24;}return y-x;}
function trCard(t){
return '<div class="card tr"><span class="what">'+esc(t.what)+'</span><div class="big">'+esc(t.t)+'</div><div class="sub">'+esc(t.veh)+'</div>'+
'<div class="kv"><span>Fahrer</span><div>'+esc(t.drv)+'</div><span>Vor Ort</span><div>'+esc(t.ap)+'</div><span>Auftrag</span><div>'+esc(t.fa)+'</div></div>'+
'<div class="mini">'+esc(t.note)+'</div>'+
'<div class="btns">'+callA('btn red',t.dt,I_CALL+'Fahrer anrufen','',{n:t.drv,r:'Fahrer',t:t.dt,m:t.dm})+'<a class="btn wa" href="'+wa(t.dt)+'" target="_blank" rel="noopener">'+I_WA+'WhatsApp</a>'+(t.dm?'<a class="btn" href="mailto:'+esc(t.dm)+'">'+I_MAIL+'Mail</a>':'')+''+callA('btn',t.apt,I_CALL+esc(t.ap.split(' ')[0]),'',{k:(byName(t.ap)||{}).k,n:t.ap,r:'Vor Ort',t:t.apt})+'</div></div>';
}
function vTage(){
var d=DATA.d[DAY],td=new Date(),iso=td.getFullYear()+'-'+('0'+(td.getMonth()+1)).slice(-2)+'-'+('0'+td.getDate()).slice(-2),h='<div class="days">';
DATA.d.forEach(function(x,i){h+='<button class="'+(i===DAY?'on':'')+(x.d===iso?' today':'')+'" onclick="DAY='+i+';render()"><b>'+x.w+'</b><small>'+x.dt+'</small></button>';});
h+='</div><div class="card"><h2>'+esc(d.ph)+'</h2><div class="sub">'+esc(d.w+' '+d.dt+', '+d.tm)+'</div><div class="mini">'+d.s.length+' Personen vor Ort</div></div>';
if(d.tr!==undefined){h+=trCard(DATA.t[d.tr]);}
h+='<div class="lbl">Crew an diesem Tag</div><div class="card" style="padding:4px 14px">';
d.s.forEach(function(s){var p=PK[s[0]],long=hrs(s[1],s[2])>10;h+='<div class="p">'+av(p)+'<div><div class="n">'+nm(p)+'</div><div class="r">'+esc(p.r)+'</div><div class="tm'+(long?' late':'')+'">'+s[1]+' bis '+s[2]+(long?', '+String(hrs(s[1],s[2])).replace('.',',')+' h':'')+'</div></div>'+acts(p)+'</div>';});
return h+'</div>';
}
function vCrew(){
var h='<div class="lbl">'+DATA.p.length+' Personen, Reihenfolge nach Rolle</div><div class="card" style="padding:4px 14px">';
DATA.p.forEach(function(p){
var dots='<div class="dots">'+DATA.d.map(function(d){var on=d.s.some(function(s){return s[0]===p.k;});return '<i class="'+(on?'on':'')+'">'+d.w+'</i>';}).join('')+'</div>';
h+='<div class="p">'+av(p)+'<div><div class="n">'+nm(p)+(p.notk?'':tkOf(p.k)?' <span class="tag ok">Ticket</span>':' <span class="tag no">kein Ticket</span>')+'</div><div class="r">'+esc(p.r)+'</div><div class="ph">'+esc(p.t)+'</div>'+dots+'</div>'+acts(p)+'</div>';});
return h+'</div>';
}
var CK={};try{CK=JSON.parse(localStorage.getItem('fofpl_ck')||'{}');}catch(e){CK={};}
var I_CK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function ckBtn(t){return '<button class="ck'+(CK[t.no]?' on':'')+'" onclick="ckT(\''+t.no+'\')" aria-pressed="'+!!CK[t.no]+'" aria-label="Ticket '+t.n+' abhaken">'+I_CK+'</button>';}
function ckT(no){if(CK[no]){delete CK[no];}else{CK[no]=1;}try{localStorage.setItem('fofpl_ck',JSON.stringify(CK));}catch(e){}var y=window.scrollY;render();window.scrollTo(0,y);}
function tkOf(k){return DATA.tk.filter(function(t){return t.k===k;})[0];}
function showQ(n){var t=DATA.tk[n];document.getElementById('qri').src=t.q;document.getElementById('qrn').textContent=t.name;document.getElementById('qrm').textContent=t.typ+' Ticket, '+t.no;document.getElementById('qrv').style.display='flex';}
function vTix(){
var pers=DATA.tk.filter(function(t){return t.name;}),free=DATA.tk.filter(function(t){return !t.name;});
var miss=DATA.p.filter(function(p){return !p.notk&&!tkOf(p.k);}),nd=DATA.tk.filter(function(t){return CK[t.no];}).length;
var h='<div class="card"><h2>'+DATA.tk.length+' Tickets</h2><div class="sub">'+esc(DATA.i.tkv)+'</div><div class="mini"><b>'+nd+' von '+DATA.tk.length+' abgehakt</b></div><div class="prog"><i style="width:'+(nd/DATA.tk.length*100)+'%"></i></div><div class="mini">'+pers.length+' personalisiert, '+free.length+' frei. '+(miss.length?miss.length+' aus der Crew ohne Ticket.':'Alle aus der Crew haben ein Ticket.')+'</div>'+
'<div class="btns"><a class="btn red" href="'+esc(DATA.i.fw)+'" target="_blank" rel="noopener">FoF Aussteller-Backend</a></div></div>';
h+='<div class="lbl">Personalisiert, Code antippen zum Vorzeigen</div><div class="card" style="padding:4px 14px">';
DATA.tk.forEach(function(t,i){if(!t.name){return;}var p=t.k?PK[t.k]:null;h+='<div class="tk'+(CK[t.no]?' done':'')+'"><img class="q" src="'+t.q+'" alt="" onclick="showQ('+i+')"><div><div class="n">'+esc(t.name)+(p?'':' <span class="tag no">nicht in Dispo</span>')+'</div><div class="r">'+esc(t.typ)+', '+esc(t.no)+'</div></div><div class="side">'+(p?''+callA('ic call',p.t,I_CALL,p.f+' anrufen',{k:p.k})+'':'')+ckBtn(t)+'</div></div>';});
h+='</div>';
if(miss.length){h+='<div class="lbl">Crew ohne Ticket</div><div class="card" style="padding:4px 14px">';miss.forEach(function(p){h+='<div class="p">'+av(p)+'<div><div class="n">'+nm(p)+'</div><div class="r">'+esc(p.r)+'</div></div>'+acts(p)+'</div>';});h+='</div>';}
h+='<div class="lbl">Frei, noch nicht personalisiert</div><div class="card" style="padding:4px 14px">';
free.forEach(function(t){h+='<div class="tk'+(CK[t.no]?' done':'')+'"><div class="q0">frei</div><div><div class="n">Freies Ticket</div><div class="r">'+esc(t.typ)+', '+esc(t.no)+'</div></div><div class="side">'+ckBtn(t)+'</div></div>';});
return h+'</div><p class="note">Freie Tickets im Aussteller-Backend oder in Stager auf den Namen setzen, erst dann sind sie gültig. Haken werden nur auf diesem Gerät gespeichert.</p>';
}
function vTrans(){var h='<div class="lbl">Fahrzeugdispo</div>';DATA.t.forEach(function(t){h+=trCard(t);});return h;}
function vInfo(){
var i=DATA.i,h='<div class="card"><h2>'+esc(i.va)+'</h2><div class="sub">Messetage '+esc(i.vad)+'</div><div class="kv"><span>Auftrag</span><div>'+esc(i.auf)+'</div><span>Ort</span><div>'+esc(i.ort)+'<br>'+esc(i.adr)+'</div></div>'+
'<div class="btns"><a class="btn red" href="'+esc(i.fw)+'" target="_blank" rel="noopener">FoF Aussteller-Backend</a><a class="btn" href="'+esc(i.maps)+'" target="_blank" rel="noopener">'+I_MAP+'Karte</a><a class="btn" href="'+esc(i.stand)+'">Stand und Material</a></div></div>';
h+='<div class="lbl">Aufgefallen beim Aufbereiten</div>';
DATA.h.forEach(function(x){h+='<div class="card warn"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div>';});
return h+'<p class="note">'+esc(i.stamp)+'. Arbeitszeiten bitte selbst rechtlich prüfen.</p>';
}
function render(){POP=[];var v=document.getElementById('view');v.innerHTML=CUR==='tage'?vTage():CUR==='crew'?vCrew():CUR==='tix'?vTix():CUR==='trans'?vTrans():vInfo();}
function tab(t){CUR=t;var b=document.querySelectorAll('#tabs button');for(var i=0;i<b.length;i++){b[i].className=b[i].getAttribute('data-t')===t?'on':'';}render();window.scrollTo(0,0);}
(function(){var s=null;try{s=localStorage.getItem('fofpl');}catch(e){}if(s){tryPw(s,true);}})();
</script>
</body>
</html>
